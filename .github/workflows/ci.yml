name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: .NET build + xUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build + test
        run: dotnet test tests/ChequeVerification.Web.Tests/ChequeVerification.Web.Tests.csproj

  python:
    name: Python API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/verification-api
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/verification-api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        # Excluded: need a GPU/torch + matching AI checkpoint, or machine-local
        # data files (CEDAR). They are documented in services/verification-api/README.md.
        run: >
          python -m pytest tests/ -q --tb=short
          --ignore=tests/test_ai_signature_verification.py
          --ignore=tests/test_v4_guardrails.py
          --ignore=tests/test_end_to_end_diagnostic.py
          --deselect tests/test_decision_policy.py::test_source_datasets_unchanged
